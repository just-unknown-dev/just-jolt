name: just_jolt
description: "Jolt Physics v5.6.0 for Dart: joltc's C API and a C layer for batched reads, events, queries, characters and joints, compiled from source by a native build hook."
version: 0.1.0
homepage: https://github.com/just-unknown-dev/just-jolt
repository: https://github.com/just-unknown-dev/just-jolt
issue_tracker: https://github.com/just-unknown-dev/just-jolt/issues

topics:
  - physics
  - ffi
  - native-assets

environment:
  sdk: ^3.11.0

dependencies:
  # code_assets 2.0's only break (OS and Architecture are no longer const map
  # keys) does not touch the hook, so both lines work; physics engines that
  # still pin 1.x can share it.
  code_assets: ">=1.2.0 <3.0.0"
  ffi: ^2.1.0
  hooks: ^2.0.0
  native_toolchain_c: ^0.19.3

dev_dependencies:
  # Generates lib/src/native/bindings.g.dart (see ffigen.yaml).
  ffigen: ^12.0.0
  lints: ^6.0.0
  test: ^1.26.0

# This package's own tests need the library. An app that uses Jolt says the
# same in its pubspec; without it nothing is compiled (see hook/build.dart).
hooks:
  user_defines:
    just_jolt:
      build: true
